name: Academy CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  academy-checks:
    name: Academy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-16
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, verified 2027.1.0-10-17.1.0
        with:
          node-version: '24'
      - run: node scripts/check-secrets.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4, verified 2026-10-16
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:server
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=moderate --fetch-retries=0 --fetch-timeout=15000
      - name: Build production container
        run: docker build -t kglab-academy:ci .
      - name: Scan production image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kglab-academy:ci
          grype-version: 'v0.120.1'
          severity-cutoff: high
          fail-build: true
          output-format: table
      - name: Check constrained container startup
        shell: bash
        run: |
          docker run --detach --name academy-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory=256m --cpus=0.5 --pids-limit=64 --tmpfs /app/data:rw,noexec,nosuid,size=80m,uid=1000,gid=1000 -p 127.0.0.1:18080:8080 -e KGLAB_PUBLIC_ORIGIN=https://academy.example.com kglab-academy:ci
          trap 'docker logs academy-ci; docker rm -f academy-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Host: academy.example.com' http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save kglab-academy:ci --output "$RUNNER_TEMP/academy-image.tar"
      - name: Transfer tested image to publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academy-image
          path: ${{ runner.temp }}/academy-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-image:
    name: Publish Academy image
    needs: academy-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: academy-image
          path: image
          digest-mismatch: error
      - name: Publish exact tested image to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/academy-docker-auth
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          docker load --input image/academy-image.tar
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kglab-academy:ci "$image:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_SHA"
          {
            echo '## Academy image ready'
            echo "Commit-tagged image: \`$image:$GITHUB_SHA\`"
            echo 'Published repository digest:'
            docker image inspect "$image:$GITHUB_SHA" --format '{{join .RepoDigests "\n"}}'
            echo 'Use the digest in your GitOps configuration after reviewing this release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry login
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/academy-docker-auth
        run: docker logout ghcr.io
